[package]
name = "aniko"
version = "0.1.0"
description = "Masaüstü anime kızı companion"
authors = ["you"]
edition = "2021"

[lib]
name = "aniko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
